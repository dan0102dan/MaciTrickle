name: Build OpenWrt and Entware packages

on:
  push:
    branches-ignore:
      - 'refs/tags/*'
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and populate
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.collect.outputs.configs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build config matrix
        id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          configs = sorted(Path("config").glob("*/*.config"))

          if not configs:
              raise SystemExit("No build configs found")

          matrix = []
          for config in configs:
              item = {
                  "config": config.as_posix(),
                  "name": config.stem,
                  "label": config.stem,
                  "openwrt_version": "",
                  "package_ext": "ipk",
              }
              if config.parent.name == "openwrt":
                  for version, package_ext in (
                      ("24.10.4", "ipk"),
                      ("25.12.5", "apk"),
                  ):
                      matrix.append({
                          **item,
                          "label": f"{config.stem} / OpenWrt {version}",
                          "openwrt_version": version,
                          "package_ext": package_ext,
                      })
              else:
                  matrix.append(item)

          print(f"configs={json.dumps(matrix, separators=(',', ':'))}")
          PY

  build:
    name: Build packages (${{ matrix.label }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Feed repositories rate-limit/fail when every OpenWrt architecture
      # clones them at once. Keep enough concurrency for useful throughput
      # without creating a synchronized clone storm -- each job now clones
      # only the two feeds it needs, so this can sit well above the six
      # parallel jobs the full-feed setup had to be held to.
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check cross-toolchain availability
        id: toolchain
        env:
          OPENWRT_VERSION: "${{ matrix.openwrt_version || '24.10.4' }}"
        run: |
          cp "${{ matrix.config }}" .config
          . ./.config
          case "$PLATFORM/$TARGET" in
            entware/*_kn)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "entware_config=${TARGET%_kn}" >> "$GITHUB_OUTPUT"
              ;;
            # Plain (non-Keenetic) Entware targets reuse the exact same
            # proven ownik/gh-action-entware-sdk mechanism as the _kn
            # targets above (D-48) -- entware_config is just the arch
            # name verbatim, no _kn suffix to strip. tools/ci/entware-
            # package/Makefile is target-aware and skips ENTWARE_KN,
            # the NDM hook, and the socat dep for these (D-51).
            entware/aarch64-3.10 | entware/mips-3.4 | entware/mipsel-3.4 | entware/armv7-3.2)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "entware_config=$TARGET" >> "$GITHUB_OUTPUT"
              ;;
            # Well-known, stable target/subtarget for each package arch below
            # (source: downloads.openwrt.org's own release layout for
            # OPENWRT_VERSION). x86_64/mips_24kc/mipsel_24kc were verified
            # via real CI (D-50); the rest below are best-effort mappings
            # (D-51) from general OpenWrt hardware-target knowledge, not
            # individually verified against a live feed/SDK index from this
            # sandbox (proxy blocks downloads.openwrt.org) -- expect some to
            # 404 or fail on first real CI run and need correction, exactly
            # like D-50's aarch64_generic did. Package archs judged too
            # ambiguous to guess with any confidence are left in the
            # default gated case below rather than pick blindly.
            openwrt/x86_64)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=x86" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=64" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/mips_24kc)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=ath79" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/mipsel_24kc)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=ramips" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=mt7621" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/i386_pentium-mmx | openwrt/i386_pentium4)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=x86" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/loongarch64_generic)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=loongarch64" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/aarch64_cortex-a53)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm27xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=bcm2710" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/aarch64_cortex-a72)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm27xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=bcm2711" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_arm1176jzf-s_vfp)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm27xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=bcm2708" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a15_neon-vfpv4)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=ipq806x" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a9 | openwrt/arm_cortex-a9_neon)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=mvebu" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=cortexa9" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_xscale)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=ixp4xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a7)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=mediatek" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=mt7623" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a7_neon-vfpv4)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=sunxi" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=cortexa7" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a9_vfpv3-d16)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm53xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/mips64_octeonplus)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=octeon" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/mipsel_74kc)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm47xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=mips74k" >> "$GITHUB_OUTPUT"
              ;;
            # D-53: second pass over the archs D-51 left gated as "too
            # ambiguous" -- reconsidered with less conservatism per
            # explicit user request. Real candidates found for 7 of the
            # remaining 8 (see decisions.md D-53 for the per-arch
            # reasoning); still no arm_* byte-order check in this step
            # to worry about (only aarch64_*/mips_*/mipsel_*/x86_64 are
            # checked below), so these carry no verification-time risk
            # beyond "does the SDK download exist".
            openwrt/aarch64_cortex-a76)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=bcm27xx" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=bcm2712" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_arm926ej-s)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=gemini" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a5_vfpv4)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=at91" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=sama5" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a7_vfpv4)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=realtek" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=rtl930x" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/mips64_mips64r2)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=octeon" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_fa526)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=gemini" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            openwrt/arm_cortex-a8_vfpv3)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=sunxi" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=cortexa8" >> "$GITHUB_OUTPUT"
              ;;
            # D-54: retried aarch64_generic (D-50's one confirmed 404,
            # armvirt/64) under the theory that OpenWrt renamed its
            # generic/QEMU-class aarch64 target from "armvirt" to "armsr"
            # (subtarget "armv8") at some point -- if that rename memory
            # is right this fixes the 404; if wrong it just 404s again
            # and reverts to gated same as before, no worse off either way.
            openwrt/aarch64_generic)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=armsr" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=armv8" >> "$GITHUB_OUTPUT"
              ;;
            # mips_4kec/mips_mips32 (no "el") need a genuinely BIG-endian
            # MIPS target per this step's own later `mips_*` byte-order
            # assertion -- ramips/bcm47xx (the only other MIPS32 cores
            # that came to mind) are little-endian, and no OpenWrt target
            # for the older 4KEc-class AR71xx generation or a plain
            # generic big-endian mips32 baseline came to mind either.
            # Rather than leave these flatly gated, reuse ath79/generic
            # (the one target confirmed big-endian in this project's own
            # CI, via mips_24kc) on the theory that it at least produces
            # a byte-order-correct, linkable binary -- caveat: ath79's
            # actual -march default may assume 24Kc/74Kc-specific
            # instruction extensions genuine 4KEc-class or plain-mips32
            # hardware lacks, so this is a "best available" reuse, not a
            # confirmed-correct match; if it fails or produces a broken
            # binary on real hardware, revert to gated.
            openwrt/mips_4kec | openwrt/mips_mips32)
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "openwrt_target=ath79" >> "$GITHUB_OUTPUT"
              echo "openwrt_subtarget=generic" >> "$GITHUB_OUTPUT"
              ;;
            # riscv64_generic (riscv64/generic), mips64el_mips64r2
            # (loongson64/generic), and mipsel_mips32 (bcm63xx/generic)
            # were tried in D-51 and all three 404'd on their sha256sums
            # lookup for OPENWRT_VERSION=24.10.1 (confirmed via real CI)
            # -- reverted to gated rather than guess again blindly.
            # mipsel_24kc_24kf (D-53) was tried as lantiq/xrx200: SDK
            # downloaded and built fine, but the resulting binary is
            # BIG-endian MIPS (confirmed via real CI's own readelf
            # check) -- lantiq's whole MIPS lineup is apparently
            # big-endian, contradicting the "mipsel_" package arch name.
            # No better little-endian 24Kc+FPU candidate came to mind,
            # so reverted to gated rather than guess again.
            *)
              echo "::notice title=${{ matrix.name }}::Packaging for this target is not yet automated in CI: no real Entware/OpenWrt cross-toolchain + feed sysroot is provisioned for PLATFORM=$PLATFORM TARGET=$TARGET. See docs/c-rewrite/toolchains.md and decisions.md D-45. Skipping this job's build step."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "openwrt_version=$OPENWRT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.JS
        if: steps.toolchain.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prepare Entware package feed
        id: entware_feed
        if: steps.toolchain.outputs.entware_config != ''
        run: |
          mkdir -p .build
          eval export $(make _return_export_dynamic_env);
          cp "${{ matrix.config }}" .config
          make build_frontend
          make _return_export_dynamic_env > .build/entware-package.env

          feed_dir="${RUNNER_TEMP}/magitrickle-feed-${{ matrix.name }}"
          artifacts_dir="${RUNNER_TEMP}/magitrickle-artifacts-${{ matrix.name }}"
          mkdir -p "$feed_dir/magitrickle" "$artifacts_dir"
          cp tools/ci/entware-package/Makefile "$feed_dir/magitrickle/Makefile"
          {
            printf 'MAGITRICKLE_VERSION:=%s\n' "$PKG_VERSION"
            printf 'MAGITRICKLE_RELEASE:=%s\n' "$PKG_REVISION"
            printf 'MAGITRICKLE_TARGET:=%s\n' "${{ matrix.name }}"
          } > "$feed_dir/magitrickle/version.mk"
          tar -czf "$feed_dir/magitrickle/magitrickle-source.tar.gz" \
            --transform "s,^,magitrickle-${PKG_VERSION}/," \
            LICENSE files src/backend-c src/frontend/dist

          echo "feed_dir=$feed_dir" >> "$GITHUB_OUTPUT"
          echo "artifacts_dir=$artifacts_dir" >> "$GITHUB_OUTPUT"

      - name: Build with prebuilt Entware SDK
        id: entware_sdk
        if: steps.toolchain.outputs.entware_config != ''
        continue-on-error: true
        # v1, pinned to its verified commit rather than a mutable tag.
        uses: ownik/gh-action-entware-sdk@003ddc33bb3b12a2f96e0c4689c56351614cf01a
        env:
          ARCH: ${{ steps.toolchain.outputs.entware_config }}
          ARTIFACTS_DIR: ${{ steps.entware_feed.outputs.artifacts_dir }}
          BUILD_LOG: 1
          FEED_DIR: ${{ steps.entware_feed.outputs.feed_dir }}
          PACKAGES: magitrickle
          V: s

      - name: Report Entware SDK build failure
        if: steps.entware_sdk.outcome == 'failure'
        run: |
          log_root="${{ steps.entware_feed.outputs.artifacts_dir }}/logs"
          if [ -d "$log_root" ]; then
            {
              echo "Entware package build failed. Relevant log lines:"
              while IFS= read -r -d '' log; do
                matches=$(
                  grep -E \
                    'make\[[0-9]+\]: \*\*\*|(^|: )(fatal )?error:|undefined reference|No rule to make target|collect2: error|ld returned [0-9]+ exit status' \
                    "$log" || true
                )
                if [ -n "$matches" ]; then
                  echo "==> $log <=="
                  printf '%s\n' "$matches" | tail -n 80
                  echo "Last 20 lines:"
                  tail -n 20 "$log"
                fi
              done < <(find "$log_root" -type f -print0 | sort -z)
            } | tee "${RUNNER_TEMP}/entware-sdk-failure.txt"
          else
            echo "Entware package build failed and produced no BUILD_LOG files." |
              tee "${RUNNER_TEMP}/entware-sdk-failure.txt"
          fi

          message=$(
            tail -n 200 "${RUNNER_TEMP}/entware-sdk-failure.txt" |
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              awk 'BEGIN { ORS="%0A" } { print }'
          )
          echo "::error title=Entware SDK ${{ matrix.name }}::$message"
          exit 1

      - name: Prepare OpenWrt SDK + package
        id: openwrt_sdk
        if: steps.toolchain.outputs.openwrt_target != ''
        continue-on-error: true
        run: |
          set -eu
          mkdir -p .build
          eval export $(make _return_export_dynamic_env);
          cp "${{ matrix.config }}" .config
          make build_frontend
          make _return_export_dynamic_env > .build/openwrt-package.env
          . .build/openwrt-package.env

          version="${{ steps.toolchain.outputs.openwrt_version }}"
          target="${{ steps.toolchain.outputs.openwrt_target }}"
          subtarget="${{ steps.toolchain.outputs.openwrt_subtarget }}"
          base_url="https://downloads.openwrt.org/releases/${version}/targets/${target}/${subtarget}"

          sdk_root="${RUNNER_TEMP}/openwrt-sdk-${{ matrix.name }}"
          mkdir -p "$sdk_root"
          log_dir="${RUNNER_TEMP}/openwrt-logs-${{ matrix.name }}"
          mkdir -p "$log_dir"
          echo "log_dir=$log_dir" >> "$GITHUB_OUTPUT"

          # A release only publishes the targets it still supports, so a
          # 404 here means "this OpenWrt version has no SDK for the
          # target/subtarget this package arch maps to", not a broken
          # build. Report it and skip, the same way an unmapped arch is
          # skipped above. Anything else (5xx, DNS, timeouts) is a real
          # failure -- --retry covers the transient ones, and a 404 is
          # deliberately not retried.
          http_code=$(
            curl --retry 5 --retry-delay 5 --connect-timeout 30 -sSL \
              -o "$sdk_root/sha256sums" -w '%{http_code}' \
              "${base_url}/sha256sums" 2>>"$log_dir/download.log" || echo 000
          )
          echo "GET ${base_url}/sha256sums -> $http_code" >> "$log_dir/download.log"
          if [ "$http_code" = 404 ]; then
            echo "::warning title=${{ matrix.name }}::OpenWrt ${version} publishes no SDK for ${target}/${subtarget}, so no package is built for this arch on this release. Update the arch-to-target mapping in build.yml if the target was renamed."
            echo "sdk_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http_code" != 200 ]; then
            echo "Failed to fetch ${base_url}/sha256sums (HTTP $http_code)" >&2
            exit 1
          fi

          (
            cd "$sdk_root"
            sdk_file=$(grep -oE 'openwrt-sdk-[^ ]+\.tar\.(zst|xz)' sha256sums | head -n1)
            if [ -z "$sdk_file" ]; then
              echo "Could not find an SDK archive name in ${base_url}/sha256sums" | tee -a "$log_dir/download.log" >&2
              exit 1
            fi
            echo "SDK archive: $sdk_file" | tee -a "$log_dir/download.log"
            curl --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 -fsSL -o "$sdk_file" \
              "${base_url}/${sdk_file}" 2>&1 | tee -a "$log_dir/download.log"
            grep -- "$sdk_file\$" sha256sums | sha256sum -c - 2>&1 | tee -a "$log_dir/download.log"

            case "$sdk_file" in
              *.tar.zst) tar --use-compress-program=unzstd -xf "$sdk_file" ;;
              *.tar.xz) tar -xJf "$sdk_file" ;;
              *) echo "Unrecognized SDK archive extension: $sdk_file" >&2; exit 1 ;;
            esac
          )
          echo "sdk_root=$sdk_root" >> "$GITHUB_OUTPUT"

          sdk_dir=$(find "$sdk_root" -mindepth 1 -maxdepth 1 -type d -name 'openwrt-sdk-*')
          if [ -z "$sdk_dir" ]; then
            echo "Extracted SDK directory not found under $sdk_root" >&2
            exit 1
          fi
          echo "sdk_dir=$sdk_dir" >> "$GITHUB_OUTPUT"

          pkg_dir="$sdk_dir/package/net/magitrickle"
          mkdir -p "$pkg_dir"
          cp tools/ci/openwrt-package/Makefile "$pkg_dir/Makefile"
          magitrickle_version="$PKG_VERSION"
          if [ "${{ matrix.package_ext }}" = apk ]; then
            magitrickle_version="$PKG_VERSION_APK"
          fi
          magitrickle_release="$PKG_REVISION"
          {
            printf 'MAGITRICKLE_VERSION:=%s\n' "$magitrickle_version"
            printf 'MAGITRICKLE_RELEASE:=%s\n' "$magitrickle_release"
          } > "$pkg_dir/version.mk"
          tar -czf "$pkg_dir/magitrickle-source.tar.gz" \
            --transform "s,^,magitrickle-${magitrickle_version}/," \
            LICENSE files src/backend-c src/frontend/dist

          # cJSON isn't in any OpenWrt feed for this release (confirmed via
          # CI: "WARNING: No feed for package 'libcjson' found" -- see
          # decisions.md D-50), so it's vendored as its own in-tree SDK
          # package, discovered by the package scanner the same way
          # `magitrickle` itself is, with no `feeds install` step needed.
          cjson_pkg_dir="$sdk_dir/package/libs/libcjson"
          mkdir -p "$cjson_pkg_dir"
          cp tools/ci/openwrt-package-libcjson/Makefile "$cjson_pkg_dir/Makefile"

          # Project version variables use generic PKG_* names. Do not leak
          # them into the SDK: OpenWrt make otherwise applies them to system
          # packages too, producing invalid apk versions.
          unset COMMIT COMMITS_SINCE_TAG PKG_REVISION PKG_VERSION PKG_VERSION_APK \
            PKG_VERSION_DISPLAY PKG_VERSION_PRERELEASE PRERELEASE_DATE TAG

          (
            cd "$sdk_dir"
            # Every dependency resolves out of `base` or `packages` (see
            # feeds-install.log), so cloning luci/routing/telephony/video
            # on top of those is pure cost. `base` is also declared
            # src-git-full, i.e. the entire openwrt.git history, where a
            # shallow clone builds the same packages. Together this is
            # what lets the matrix run more jobs in parallel without the
            # feed servers throttling. Fall back to the SDK's own list if
            # the layout ever stops matching.
            awk '
              $1 ~ /^src-git(-full)?$/ && ($2 == "base" || $2 == "packages") {
                # url;ref names a branch or tag, which clones shallow
                # fine; url^sha needs a fetch by commit the server may
                # refuse on a shallow clone, so leave those alone.
                if ($3 !~ /\^/) { $1 = "src-git" }
                print
              }
            ' feeds.conf.default > feeds.conf
            if [ "$(wc -l < feeds.conf)" -ne 2 ]; then
              echo "unexpected feeds.conf.default layout; using it unchanged" >&2
              rm -f feeds.conf
            fi

            : > "$log_dir/feeds-update.log"
            feeds_updated=false
            for attempt in 1 2 3 4; do
              echo "feeds update attempt $attempt/4" >> "$log_dir/feeds-update.log"
              if ./scripts/feeds update -a >> "$log_dir/feeds-update.log" 2>&1; then
                feeds_updated=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 10))
              fi
            done
            if [ "$feeds_updated" != true ]; then
              echo "feeds update failed after 4 attempts" >> "$log_dir/feeds-update.log"
              exit 1
            fi
            ./scripts/feeds install libyaml pcre2 libmnl libcurl \
              iptables-nft iptables-mod-conntrack-extra kmod-ipt-nat kmod-ipt-ipset ip6tables-nft libatomic \
              > "$log_dir/feeds-install.log" 2>&1

            make defconfig > "$log_dir/defconfig.log" 2>&1
            # `feeds install` only exposes recipes; it does not stage their
            # headers or libraries. Build compile-time dependencies first.
            # cJSON installs a private static archive into staging. PCRE2,
            # yaml, libmnl and curl remain normal runtime libraries.
            make package/yaml/{clean,compile} \
                 package/pcre2/{clean,compile} \
                 package/libmnl/{clean,compile} \
                 package/curl/{clean,compile} \
                 package/libcjson/{clean,compile} \
                 V=s > "$log_dir/deps-build.log" 2>&1
            make package/magitrickle/{clean,compile} V=s > "$log_dir/build.log" 2>&1
          )

      - name: Report OpenWrt SDK build failure
        if: steps.openwrt_sdk.outcome == 'failure'
        run: |
          log_dir="${{ steps.openwrt_sdk.outputs.log_dir }}"
          {
            echo "OpenWrt SDK package build failed. Relevant log lines:"
            if [ -n "$log_dir" ] && [ -d "$log_dir" ]; then
              while IFS= read -r -d '' log; do
                matches=$(
                  grep -E \
                    'make\[[0-9]+\]: \*\*\*|(^|: )(fatal )?error:|undefined reference|No rule to make target|collect2: error|ld returned [0-9]+ exit status|curl:|sha256sum:.*FAILED|WARNING:|[Nn]o feed for package|[Nn]ot found' \
                    "$log" || true
                )
                if [ -n "$matches" ]; then
                  echo "==> $log <=="
                  printf '%s\n' "$matches" | tail -n 80
                  echo "Last 20 lines:"
                  tail -n 20 "$log"
                fi
              done < <(find "$log_dir" -type f -print0 | sort -z)
            else
              echo "No log directory captured (failure before SDK extraction)."
            fi
            # feeds-install.log rarely matches the error patterns above (a
            # missing/misnamed package prints a WARNING, not an error) but is
            # exactly what explains a later "No rule to make target
            # package/<name>/..." failure, so always show its tail regardless
            # of match.
            feeds_install_log="$log_dir/feeds-install.log"
            if [ -f "$feeds_install_log" ]; then
              echo "==> $feeds_install_log (full) <=="
              cat "$feeds_install_log"
            fi
          } | tee "${RUNNER_TEMP}/openwrt-sdk-failure.txt"

          message=$(
            tail -n 400 "${RUNNER_TEMP}/openwrt-sdk-failure.txt" |
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              awk 'BEGIN { ORS="%0A" } { print }'
          )
          echo "::error title=OpenWrt SDK ${{ matrix.name }}::$message"
          exit 1

      - name: Collect and verify package
        id: package_outputs
        if: steps.toolchain.outputs.ready == 'true' && steps.openwrt_sdk.outputs.sdk_available != 'false'
        run: |
          set -eu
          if [ -n "${{ steps.toolchain.outputs.entware_config }}" ]; then
            mapfile -t packages < <(
              find "${{ steps.entware_feed.outputs.artifacts_dir }}" \
                -type f -name 'magitrickle_*.ipk' | sort
            )
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "Expected exactly one magitrickle IPK, found ${#packages[@]}" >&2
              printf '%s\n' "${packages[@]}" >&2
              exit 1
            fi

            . .build/entware-package.env
            package=".build/magitrickle_${PKG_VERSION}-${PKG_REVISION}_entware_${{ matrix.name }}.ipk"
            cp "${packages[0]}" "$package"

            data_archive=$(mktemp)
            binary=$(mktemp)
            if ar t "$package" >/dev/null 2>&1; then
              ar p "$package" data.tar.gz > "$data_archive"
            else
              data_member=$(
                tar -tf "$package" |
                  awk '$0 == "data.tar.gz" || $0 == "./data.tar.gz" { print; exit }'
              )
              if [ -z "$data_member" ]; then
                echo "No data.tar.gz member in $package" >&2
                exit 1
              fi
              tar -xOf "$package" "$data_member" > "$data_archive"
            fi
            binary_member=$(
              tar -tzf "$data_archive" |
                awk '$0 == "opt/bin/magitrickled" || $0 == "./opt/bin/magitrickled" { print; exit }'
            )
            if [ -z "$binary_member" ]; then
              echo "No /opt/bin/magitrickled in $package" >&2
              exit 1
            fi
            tar -xzOf "$data_archive" "$binary_member" > "$binary"

            readelf -h "$binary"
            readelf -l "$binary"
            case "${{ matrix.name }}" in
              aarch64-*)
                readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
                readelf -h "$binary" | grep -Eq 'Data:.*little endian'
                readelf -l "$binary" | grep -F '/opt/lib/ld-linux-aarch64.so.1'
                ;;
              mips-*)
                readelf -h "$binary" | grep -Eq 'Machine:.*MIPS'
                readelf -h "$binary" | grep -Eq 'Data:.*big endian'
                readelf -l "$binary" | grep -F '/opt/lib/ld.so.1'
                ;;
              mipsel-*)
                readelf -h "$binary" | grep -Eq 'Machine:.*MIPS'
                readelf -h "$binary" | grep -Eq 'Data:.*little endian'
                readelf -l "$binary" | grep -F '/opt/lib/ld.so.1'
                ;;
            esac

            echo "package_1_path=$package" >> "$GITHUB_OUTPUT"
            echo "package_1_name=$(basename "$package")" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.toolchain.outputs.openwrt_target }}" ]; then
            sdk_dir="${{ steps.openwrt_sdk.outputs.sdk_dir }}"
            package_ext="${{ matrix.package_ext }}"
            case "$package_ext" in
              ipk) package_glob='magitrickle_*.ipk' ;;
              apk) package_glob='magitrickle-*.apk' ;;
              *) echo "Unsupported package extension: $package_ext" >&2; exit 1 ;;
            esac
            mapfile -t packages < <(
              find "$sdk_dir/bin/packages" -type f -name "$package_glob" 2>/dev/null | sort
            )
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "Expected exactly one magitrickle .$package_ext under $sdk_dir/bin/packages, found ${#packages[@]}" >&2
              printf '%s\n' "${packages[@]}" >&2
              exit 1
            fi

            . .build/openwrt-package.env
            artifact_version="$PKG_VERSION"
            if [ "$package_ext" = apk ]; then
              artifact_version="$PKG_VERSION_APK"
            fi
            package=".build/magitrickle_${artifact_version}-${PKG_REVISION}_openwrt-${{ matrix.openwrt_version }}_${{ matrix.name }}.${package_ext}"
            cp "${packages[0]}" "$package"

            # Release SDKs ship with CONFIG_AUTOREMOVE enabled, which wipes
            # a package's build directory the moment it finishes compiling
            # -- everything except .pkgdir, the staged install tree the
            # package is packed from. Read the binary from there (it is the
            # exact file that ends up in the package), and fall back to the
            # raw build output for SDKs that keep their build directories.
            binary=$(find "$sdk_dir/build_dir" -type f \( \
              -path '*/magitrickle-*/.pkgdir/magitrickle/usr/bin/magitrickled' -o \
              -path '*/magitrickle-*/src/backend-c/build/openwrt-*/magitrickled-c' \
              \) -print -quit)
            if [ -z "$binary" ] || [ ! -x "$binary" ]; then
              echo "Built magitrickled binary not found under $sdk_dir/build_dir" >&2
              exit 1
            fi

            readelf -h "$binary"
            readelf -l "$binary"
            if readelf -d "$binary" | grep -Eq 'NEEDED.*libcjson'; then
              echo "OpenWrt binary still has a dynamic cJSON dependency" >&2
              exit 1
            fi
            case "${{ matrix.name }}" in
              aarch64_*)
                readelf -h "$binary" | grep -Eq 'Machine:.*AArch64'
                readelf -h "$binary" | grep -Eq 'Data:.*little endian'
                ;;
              mips_*)
                readelf -h "$binary" | grep -Eq 'Machine:.*MIPS'
                readelf -h "$binary" | grep -Eq 'Data:.*big endian'
                ;;
              mipsel_*)
                readelf -h "$binary" | grep -Eq 'Machine:.*MIPS'
                readelf -h "$binary" | grep -Eq 'Data:.*little endian'
                ;;
              x86_64)
                readelf -h "$binary" | grep -Eq 'Machine:.*X86-64'
                ;;
            esac

            echo "package_1_path=$package" >> "$GITHUB_OUTPUT"
            echo "package_1_name=$(basename "$package")" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload package artifact 1
        if: ${{ github.event_name != 'release' && github.event_name != 'workflow_dispatch' && steps.package_outputs.outputs.package_1_path != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package_outputs.outputs.package_1_name }}
          path: ${{ steps.package_outputs.outputs.package_1_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload package assets to release
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PACKAGE_1: ${{ steps.package_outputs.outputs.package_1_path }}
        run: |
          for package in "$PACKAGE_1"; do
            if [ -n "$package" ]; then
              gh release upload "$RELEASE_TAG" "$package" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          done
